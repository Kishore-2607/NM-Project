<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy - AI Workout Generator</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="navbar">
        <a class="nav-brand" href="/">💪 FitBuddy</a>
        <div class="nav-links">
            <a href="/view-all-users">📋 Admin Dashboard</a>
        </div>
    </header>

    <div class="main-layout">
        <div class="form-card">
            <h1 class="card-title">💪 FitBuddy - AI Workout Generator</h1>
            <form action="/generate-workout" method="POST">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="user_id">User ID:</label>
                    <input type="text" id="user_id" name="user_id" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" class="form-control" min="10" max="120" required>
                </div>

                <div class="form-group">
                    <label for="weight">Weight (kg):</label>
                    <input type="number" step="0.1" id="weight" name="weight" class="form-control" min="20" max="500" required>
                </div>

                <div class="form-group">
                    <label for="goal">Fitness Goal:</label>
                    <input type="text" id="goal" name="goal" class="form-control" placeholder="e.g., weight loss, flexibility" required>
                </div>

                <div class="form-group">
                    <label for="intensity">Workout Intensity:</label>
                    <select id="intensity" name="intensity" class="form-control" required>
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary">Generate Plan</button>
            </form>
        </div>
    </div>
</body>
</html>
